<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            width: 500px;
            border-collapse: collapse;
        }

        td, th{
            border: 1px solid black;
            padding: 10px;
        }

        thead, tfoot{
            background-color: grey;
            color: white;
        }

        td.num{
            text-align: right;
        }

        td.meio{
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Tabelas Grandes</h1>
    <!--
    Anatomia de tabelas grandes
    TABLE
        THEAD
             TR, TD, TH
        TBODY
             TR, TD, TH
        TFOOT
             TR, TD, TH
    -->

    <table>
        <thead>
            <tr>
                <th>Estado</th>
                <th>Populacao</th>
                <th>Pais Comparavel</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Sao Paulo</td>
                <td class="num">45.973.194</td>
                <td class="meio">Iraque(46.042.015)</td>
            </tr>
            <tr>
                <td>Minas Gerais</td>
                <td class="num">21.322.691</td>
                <td class="meio">Zambia(21.314.956)</td>
            </tr>
            <tr>
                <td>Rio de Janeiro</td>
                <td class="num">17.219.679</td>
                <td class="meio">Camboja(17.638.801)</td>
            </tr>
        </tbody>
        <tfoot></tfoot>
    </table>
</body>
</html>
